name: analytics-quality-gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check analytics dags/extractors scripts tests
      - run: python -m pytest
      - name: Parse dbt project
        run: dbt parse --project-dir dbt_project --profiles-dir ci/dbt --no-partial-parse
      - name: Validate committed evidence
        run: python scripts/verify_release.py
